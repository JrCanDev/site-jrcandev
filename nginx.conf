server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Keep redirects relative so they work behind any host or port
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Old FAQ URL
  location = /faq/faq.php {
    return 301 /aide;
  }

  # Hashed build files: cache for a year
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Always revalidate the entry point
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Paths with a file extension are real files: no SPA fallback, real 404
  location ~ \.[a-zA-Z0-9]+$ {
    try_files $uri =404;
  }

  # Everything else is a Vue route
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
